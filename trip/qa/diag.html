<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>v23 진단</title>
<style>body{margin:0;background:#0F172A;color:#E5EDFB;font:12px/1.5 ui-monospace,monospace}
iframe{width:390px;height:844px;border:0}#out{padding:10px;white-space:pre-wrap}</style></head>
<body>
<iframe id="f" src="../index.html?qa=1"></iframe>
<pre id="out">…</pre>
<script>
(function () {
  var f = document.getElementById('f'), out = document.getElementById('out'), lines = [];
  function log(o) { lines.push(typeof o === 'string' ? o : JSON.stringify(o)); out.textContent = lines.join('\n'); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function w() { return f.contentWindow; }
  function ready() { try { var x = w(); return !!(x && x.TL && x.TL.App && x.document.getElementById('screen')); } catch (e) { return false; } }
  async function run() {
    for (var i = 0; i < 100 && !ready(); i++) await sleep(100);
    if (!ready()) return log('boot fail');
    var win = w(), doc = win.document, errs = [];
    win.localStorage.clear();
    win.addEventListener('error', function (e) { errs.push('err:' + e.message); });
    win.eval('TL.Store.connect = function (tripId) { var t = TL.Store.trip(tripId); if (t && !t.remoteCode) { t.remoteCode = "QA3001"; t.inviteCode = "QA3001"; } return Promise.resolve({ code: t && t.remoteCode }); };');
    win.eval('TL.Auth.testSignIn({ uid: "qa1", displayName: "테스트", email: "qa@example.com" })');
    win.eval('TL.Route.testSetFetcher(function (u) { __c = (__c||0)+1; return Promise.resolve({ ok: true, status: 200, json: function () { return { code: "Ok", routes: [{ distance: 8240, duration: 1500, legs: [{ distance: 3240, duration: 600 }, { distance: 5000, duration: 900 }], geometry: { coordinates: [[126.7963,37.5583],[126.9,37.56],[126.9996,37.5701],[126.977,37.5796]] } }] }; } }); });');
    win.eval([
      'var t = TL.Store.createTrip({ name: "v23 진단", destination: "서울", startDate: "2026-12-10", endDate: "2026-12-12", members: [{ id: "a", name: "재원" }] });',
      'globalThis.__tid = t.id;',
      'TL.Store.add(t.id, "schedules", { dayKey: "d1", title: "김포공항", category: "transport", lat: 37.5583, lng: 126.7963, order: 0 });',
      'TL.Store.add(t.id, "schedules", { dayKey: "d1", title: "광장시장", category: "food", lat: 37.5701, lng: 126.9996, order: 1 });',
      'TL.Store.add(t.id, "schedules", { dayKey: "d1", title: "경복궁", category: "sight", lat: 37.5796, lng: 126.977, order: 2 });'
    ].join('\n'));
    log('trip=' + win.eval('!!TL.Store.trip(__tid)') + ' code=' + win.eval('TL.Store.trip(__tid).remoteCode'));
    win.eval('TL.App.openTrip(__tid, "schedule")');
    await sleep(400);
    log({ screen: win.eval('TL.App.view.screen'), mapOpen: win.eval('String(TL.App.view.mapOpen)'), hash: win.location.hash });
    log({ routeMap: !!doc.querySelector('#route-map'), leaflet: !!doc.querySelector('.leaflet-container'), pins: doc.querySelectorAll('.rt-icon .rt-pin').length, badges: Array.prototype.map.call(doc.querySelectorAll('.rt-badge'), function (b) { return b.className + ':' + b.textContent; }) });
    for (var i2 = 0; i2 < 40; i2++) { if (doc.querySelector('.leaflet-container')) break; await sleep(250); }
    await sleep(1500);
    log({ routeMap: !!doc.querySelector('#route-map'), cls: doc.querySelector('#route-map') ? doc.querySelector('#route-map').className : '', leaflet: !!doc.querySelector('.leaflet-container'), pins: doc.querySelectorAll('.rt-icon .rt-pin').length, markers: doc.querySelectorAll('.leaflet-marker-icon').length, paths: doc.querySelectorAll('#route-map path').length, badge: (doc.querySelector('.rt-badge') || {}).textContent, calls: win.eval('__c||0') });
    // 파괴 쪽 진단
    win.eval('TL.Store.connect = function () { return Promise.resolve({}); };');
    win.eval('TL.Store.clearAll()');
    win.eval([
      'TL.Store.state().trips.push({ id: "remote_HMHLXW", name: "국내여행", destination: "강릉", startDate: "2026-11-28", endDate: "2026-11-30", members: [{ id: "a", name: "Taiji" }, { id: "c", name: "Jaewon Taiji", uid: "qa1" }], rates: {}, remoteCode: "HMHLXW", data: { schedules: [], expenses: [], checklist: [], reservations: [] } });',
      'TL.Store.notify();'
    ].join('\n'));
    await sleep(200);
    win.eval('TL.App.openTrip("remote_HMHLXW", "schedule")');
    await sleep(400);
    log({ screen: win.eval('TL.App.view.screen'), tripId: win.eval('TL.App.view.tripId'), canView: win.eval('TL.Core.canViewTrip(TL.Store.trip("remote_HMHLXW"), TL.Auth.currentUser())'), signed: win.eval('TL.Auth.signedIn()'), uid: win.eval('(TL.Auth.currentUser()||{}).uid'), screenText: (doc.querySelector('#screen').textContent || '').replace(/\s+/g, ' ').slice(0, 80), toast: (doc.querySelector('#toast') || {}).textContent });
    log({ errs: errs });
    document.title = 'diag-done';
  }
  run().catch(function (e) { log('EX ' + (e && e.stack || e)); document.title = 'diag-done'; });
})();
</script></body></html>
