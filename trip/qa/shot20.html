<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>트립로그 v20 화면 캡처 — 권한과 시간 고르기</title>
<style>
  body{margin:0;padding:16px;background:#0F172A;display:flex;gap:18px;align-items:flex-start;font-family:sans-serif;color:#fff}
  figure{margin:0}
  iframe{width:390px;height:844px;border:0;border-radius:16px;background:#fff;display:block}
  figcaption{font-size:13px;padding:8px 2px;color:#9FB3D0}
</style>
</head>
<body>
<figure><iframe id="f1" title="일정 시간 시·분 고르기" src="../index.html?shot=20a"></iframe><figcaption>일정 등록 — 시·분 칩으로 시간 고르기</figcaption></figure>
<figure><iframe id="f2" title="일행 관리 권한" src="../index.html?shot=20b"></iframe><figcaption>일반 일행 화면 — 방장만 일행을 추가·삭제</figcaption></figure>
<script>
(function () {
  'use strict';
  function ready(f) {
    try { var w = f.contentWindow; return !!(w && w.TL && w.TL.Store && w.TL.App && w.document.getElementById('screen')); } catch (e) { return false; }
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function waitReady(f) {
    for (var i = 0; i < 120; i++) { if (ready(f)) return true; await sleep(80); }
    return false;
  }
  /* 캡처용: 실제 Firestore에 방을 만들지 않도록 연결을 가짜로 바꾼다 */
  function stubConnect(w) {
    w.eval('TL.Store.connect = function (tripId) { var t = TL.Store.trip(tripId); if (t && !t.remoteCode) { t.remoteCode = "SHOT01"; t.inviteCode = "SHOT01"; } return Promise.resolve({ code: "SHOT01" }); };');
  }
  function signIn(w, uid, name, email) {
    w.TL.Auth.testSignIn({ uid: uid, displayName: name, email: email });
  }
  async function main() {
    var f1 = document.getElementById('f1'), f2 = document.getElementById('f2');
    await Promise.all([waitReady(f1), waitReady(f2)]);
    var w1 = f1.contentWindow, w2 = f2.contentWindow;
    var S1 = w1.TL.Store, S2 = w2.TL.Store;
    stubConnect(w1); stubConnect(w2);
    w1.localStorage.clear(); w2.localStorage.clear();
    await sleep(200);

    /* 1) 일정 시트의 시·분 칩 */
    signIn(w1, 'shot-owner', '재원', 'owner@example.com');
    await sleep(120);
    S1.clearAll();
    var t1 = S1.createTrip({ name: '오사카 3박 4일', destination: '오사카 · 교토', startDate: '2026-12-05', endDate: '2026-12-08',
      members: [{ id: 'm1', name: '재원', uid: 'shot-owner', email: 'owner@example.com' }, { id: 'm2', name: '아내' }, { id: 'm3', name: '아들' }] });
    S1.add(t1.id, 'schedules', { dayKey: 'd2', time: '10:00', title: '오사카성', category: 'sight', place: '오사카성', lat: 34.6873, lng: 135.5259, source: 'kakao' });
    S1.add(t1.id, 'schedules', { dayKey: 'd2', time: '12:30', title: '구로몬 시장', category: 'food', place: '구로몬 시장', lat: 34.6650, lng: 135.5060, source: 'kakao' });
    w1.TL.App.openTrip(t1.id, 'schedule');
    w1.TL.App.view.day = 'd2';
    w1.TL.App.render();
    await sleep(250);
    w1.TL.Dialogs.schedule(S1.trip(t1.id), null, 'd2');
    await sleep(150);
    var h = w1.document.querySelector('.tp-hours .tp-chip[data-h="14"]');
    var m = w1.document.querySelector('.tp-mins .tp-chip[data-m="30"]');
    if (h) h.click();
    await sleep(60);
    if (m) m.click();
    w1.document.getElementById('f_title').value = '도톤보리 산책';
    w1.document.getElementById('pl_q').value = '도톤보리';
    await sleep(300);

    /* 2) 일반 일행의 일행 관리 (방장 전용 잠금) */
    signIn(w2, 'shot-owner', '재원', 'owner@example.com');
    await sleep(120);
    S2.clearAll();
    var t2 = S2.createTrip({ name: '오사카 3박 4일', destination: '오사카 · 교토', startDate: '2026-12-05', endDate: '2026-12-08',
      members: [{ id: 'm1', name: '재원', uid: 'shot-owner', email: 'owner@example.com' }] });
    S2.addMember(t2.id, '아내', 'wife@example.com');
    S2.addMember(t2.id, '아들');
    /* 같은 여행을 일행(아내) 계정으로 보는 화면 */
    signIn(w2, 'shot-member', '아내', 'wife@example.com');
    await sleep(200);
    w2.TL.Store.setMeMember(t2.id, t2.members[1].id);
    w2.TL.App.openTrip(t2.id, 'schedule');
    await sleep(250);
    w2.TL.Dialogs.members(S2.trip(t2.id));
    await sleep(250);
    document.title = 'shot-ready';
  }
  main().catch(function (e) { document.title = 'shot-error ' + (e && e.message); });
})();
</script>
</body>
</html>
