<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>트립로그 QA — 390x844</title>
<style>
  html,body{margin:0;background:#0F172A;color:#E5EDFB;font-family:-apple-system,"Malgun Gothic",sans-serif}
  #wrap{display:flex;gap:16px;align-items:flex-start;padding:12px}
  iframe{width:390px;height:844px;border:0;border-radius:14px;background:#fff;flex:none}
  #out{margin:0;padding:12px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-width:640px}
  .p{color:#5BE49B}.f{color:#FF8A8A}.h{color:#93C5FD}
</style>
</head>
<body>
<div id="wrap">
  <iframe id="app" src="../index.html?qa=1" title="트립로그 390x844"></iframe>
  <pre id="out">running…</pre>
</div>
<iframe id="invite" style="position:absolute;left:-2000px;top:0" title="invite"></iframe>
<script>
(function () {
  'use strict';
  var out = document.getElementById('out');
  var lines = [], pass = 0, fails = [];
  var f = document.getElementById('app');
  var errs = [];

  function log(kind, msg, extra) {
    var tag = kind === 'PASS' ? 'PASS' : kind === 'FAIL' ? 'FAIL' : '--';
    lines.push(tag + ' ' + msg + (extra != null && extra !== '' ? '  [' + extra + ']' : ''));
    out.textContent = lines.join('\n');
  }
  function ok(cond, msg, extra) {
    if (cond) { pass++; log('PASS', msg); }
    else { fails.push(msg + (extra != null ? ' :: ' + extra : '')); log('FAIL', msg, extra); }
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var wins = 0, doc = null;
  function q(sel) { doc = f.contentDocument || doc; return doc.querySelector(sel); }
  function qa(sel) { doc = f.contentDocument || doc; return Array.prototype.slice.call(doc.querySelectorAll(sel)); }
  async function click(el, wait) {
    if (!el) throw new Error('click target missing');
    el.click();
    await sleep(wait == null ? 45 : wait);
  }
  async function clickSel(sel) { await click(q(sel)); }
  function setv(sel, v) {
    var el = q(sel);
    if (!el) throw new Error('no field ' + sel);
    el.value = v;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }
  function text(sel) { var el = q(sel); return el ? (el.textContent || '').replace(/\s+/g, ' ').trim() : ''; }
  async function waitFor(sel, ms) {
    var t0 = Date.now();
    while (Date.now() - t0 < (ms || 12000)) {
      if (q(sel)) return true;
      await sleep(120);
    }
    return false;
  }
  function rect(sel) { var el = q(sel); return el ? el.getBoundingClientRect() : null; }
  function noOverflow(label) {
    var sw = doc.documentElement.scrollWidth, iw = wins;
    ok(sw <= iw + 1, '가로 스크롤 없음 · ' + label, sw + ' / ' + iw);
  }
  function hitTest(sel, label) {
    var el = q(sel);
    if (!el) { ok(false, '요소 있음 · ' + label); return; }
    el.scrollIntoView({ block: 'center' });
    var r = el.getBoundingClientRect();
    var hit = doc.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    ok(!!hit && (hit === el || el.contains(hit)), '가려지지 않고 누를 수 있음 · ' + label, hit ? (hit.className || hit.tagName) : 'none');
  }
  function ready() {
    try {
      var w = f.contentWindow;
      return !!(w && w.TL && w.TL.App && w.document && w.document.getElementById('screen'));
    } catch (e) { return false; }
  }
  async function waitReady(timeout) {
    var t0 = Date.now();
    while (Date.now() - t0 < (timeout || 8000)) {
      if (ready()) return true;
      await sleep(60);
    }
    return false;
  }
  async function pickDate(iso) {
    for (var i = 0; i < 14; i++) {
      var cell = q('.cal-day[data-date="' + iso + '"]');
      if (cell) { await click(cell, 60); return true; }
      var next = q('[data-action="cal-next"]');
      if (!next) return false;
      await click(next, 60);
    }
    return false;
  }
  function memberCount() { return qa('#member-list .mchip').length; }

  window.__QA = { pass: 0, fails: [], lines: lines, done: false };

  async function run() {
    log('HEAD', '트립로그 모바일 390x844 통합 테스트 시작');
    var w = f.contentWindow;

    // 부트 오류 수집 (앱이 그려진 뒤부터)
    w.addEventListener('error', function (e) { errs.push('error: ' + (e.message || e.type)); });
    w.addEventListener('unhandledrejection', function (e) { errs.push('rejection: ' + (e.reason && e.reason.message || e.reason)); });
    var cerr = w.console.error;
    w.console.error = function () { errs.push('console.error: ' + Array.prototype.join.call(arguments, ' ')); cerr.apply(w.console, arguments); };

    doc = f.contentDocument;
    var today = new Date();
    log('INFO', 'viewport ' + w.innerWidth + 'x' + w.innerHeight + ' / tz ' + (w.Intl.DateTimeFormat().resolvedOptions().timeZone));

    // 초기 상태: 이 브라우저 프로필의 이 사이트 테스트 데이터만 비운다
    w.localStorage.clear();
    // 첫 방문자와 같은 상태로: 기존 SW 등록을 풀고 앱 셸 캐시를 비운다 → 새 SW가 설치하며 프리캐시한다
    var swClean = false;
    for (var uq = 0; uq < 25; uq++) {
      var regs0 = [];
      try { regs0 = await w.navigator.serviceWorker.getRegistrations(); } catch (e) {}
      if (!regs0.length) { swClean = true; break; }
      for (var ri = 0; ri < regs0.length; ri++) { try { await regs0[ri].unregister(); } catch (e2) {} }
      await sleep(200);
    }
    log('INFO', 'SW 정리 ' + (swClean ? '완료(등록 0)' : '실패(등록 남음)'));
    try {
      var ks = await w.caches.keys();
      await Promise.all(ks.map(function (k) { return caches.delete(k); }));
    } catch (e) {}
    var cachesAfter = [];
    try { cachesAfter = await w.caches.keys(); } catch (e) {}
    log('INFO', '캐시 정리 ' + (cachesAfter.length ? '실패:' + cachesAfter.join(',') : '완료(0)'));
    await new Promise(function (res) {
      var done = false;
      function on() { if (done) return; done = true; f.removeEventListener('load', on); res(); }
      f.addEventListener('load', on);
      f.src = '../index.html?qa=1&t=' + Date.now();   // 캐시된 예전 파일 대신 새로 받는다
      setTimeout(function () { if (!done) { done = true; f.removeEventListener('load', on); res(); } }, 8000);
    });
    await sleep(200);
    w = f.contentWindow; doc = f.contentDocument;
    for (var i = 0; i < 60 && !ready(); i++) await sleep(80);
    wins = w.innerWidth;
    w.addEventListener('error', function (e) { errs.push('error: ' + (e.message || e.type)); });
    ok(ready(), '앱이 390x844에서 부팅');
    ok(wins === 390 && w.innerHeight === 844, '뷰포트 390x844', wins + 'x' + w.innerHeight);
    if (!ready()) return finish();
    w.confirm = function () { return true; };   // 확인 대화상자는 통과

    var S = w.TL.Store;
    ok(S.trips().length >= 1, '첫 실행 예시 여행 자동 로드', S.trips().length);

    /* ===== v20: 로그인 필수 · 본인 여행만 보임 (게스트 단계) ===== */
    ok(!w.TL.Auth.signedIn(), '게스트: 로그인 안 된 상태');
    ok(!!q('.login-note'), '게스트: 홈에 로그인 안내 카드');
    ok(text('.login-note').indexOf('로그인하면 내 여행이 보여요') >= 0, '게스트: 안내 문구');
    ok(qa('.trip-card').length === 1 && text('.trip-card').indexOf('예시') >= 0, '게스트: 예시 여행만 보임', qa('.trip-card').length);
    ok(!w.eval("TL.Store.add(TL.Store.trips()[0].id, 'schedules', {dayKey:'d1', title:'게스트 기록'})"), '게스트: Store 기록 거부');
    await clickSel('[data-action="new-trip"]');
    await sleep(200);
    ok(!!q('[data-action="auth-google"]'), '게스트: 새 여행 → 로그인 시트');
    ok(text('#toast').indexOf('로그인') >= 0, '게스트: 로그인 안내 토스트', text('#toast').slice(0, 40));
    ok(S.trips().length === 1, '게스트: 여행이 만들어지지 않음', S.trips().length);
    await clickSel('[data-action="close-modal"]');

    /* v22: 환율은 실제 네트워크 대신 모의 API로 (결정적·사용자 프로젝트 영향 없음) */
    w.eval('TL.Store.testSetRateFetcher(function () { return Promise.resolve({ JPY: 9.6, USD: 1390, IDR: 0.088 }); });');

    /* v23: 도로 경로는 실제 OSRM 대신 모의 응답으로 (결정적·외부 의존 없음) */
    w.eval([
      'globalThis.__osrm = [];',
      'TL.Route.clear();',
      'TL.Route.testSetFetcher(function (u) {',
      '  __osrm.push(u);',
      '  return Promise.resolve({ ok: true, status: 200, json: function () {',
      '    return { code: "Ok", routes: [{ distance: 8240, duration: 1500, legs: [{ distance: 3240, duration: 600 }, { distance: 5000, duration: 900 }],',
      '      geometry: { coordinates: [[127.0276, 37.4979], [127.02, 37.5], [126.9723, 37.5559], [126.977, 37.56]] } }] };',
      '  } });',
      '});'
    ].join('\n'));

    /* 로그인 (가짜 인증 공급자 + 가짜 계정 저장소, 실제 Firebase 호출 없이 흐름만) */
    w.eval([
      'globalThis.__qaIOState = { docs:{}, writes:[], subs:[], unsubs:0, list:[], cb:null };',
      'globalThis.__qaIO = {',
      '  writeDoc: function (p, d) { var k = p.join("/"); __qaIOState.docs[k] = Object.assign({}, __qaIOState.docs[k] || {}, d); __qaIOState.writes.push(k); return Promise.resolve(true); },',
      '  deleteDoc: function (p) { delete __qaIOState.docs[p.join("/")]; return Promise.resolve(true); },',
      '  subscribeColl: function (p, cb) { __qaIOState.subs.push(p.join("/")); __qaIOState.cb = cb; cb(__qaIOState.list); return function () { __qaIOState.unsubs++; }; }',
      '};',
      'TL.Account.testSetIO(__qaIO);',
      'TL.Auth.setProvider({',
      '  google: function () { TL.Auth.testSignIn({ uid:"qa1", displayName:"테스트 재원", email:"qa@example.com" }); return Promise.resolve({ method:"popup" }); },',
      '  googleRedirect: function () { TL.Auth.testSignIn({ uid:"qa1", displayName:"테스트 재원", email:"qa@example.com" }); return Promise.resolve({ method:"redirect" }); },',
      '  emailSignIn: function (e, p) { TL.Auth.testSignIn({ uid:"qa1", displayName:"테스트 재원", email:e }); return Promise.resolve(TL.Auth.currentUser()); },',
      '  emailSignUp: function (e, p, n) { TL.Auth.testSignIn({ uid:"qa1", displayName:n, email:e }); return Promise.resolve(TL.Auth.currentUser()); },',
      '  resetPassword: function () { return Promise.resolve(true); },',
      '  signOut: function () { TL.Auth.testSignOut(); return Promise.resolve(true); }',
      '});',
      // 실시간 공유 방은 실제 Firestore 대신 로컬 초대코드로 대체 (QA가 사용자 프로젝트에 방을 만들지 않게)
      'globalThis.__realConnect = TL.Store.connect;',
      'globalThis.__qaRoom = 0;',
      'TL.Store.connect = function (tripId, opts) {',
      '  var t = TL.Store.trip(tripId);',
      '  if (t && !t.remoteCode) { __qaRoom++; t.remoteCode = "QA" + (3000 + __qaRoom); t.inviteCode = t.remoteCode; }',
      '  return Promise.resolve({ code: t && t.remoteCode });',
      '};'
    ].join('\n'));
    await clickSel('[data-action="open-account"]');
    await sleep(150);
    ok(!!q('[data-action="auth-google-redirect"]'), '계정 시트: 현재 창 Google 로그인 버튼');
    ok(text('.sheet-body').indexOf('팝업이 안 열릴 때') >= 0, '계정 시트: 팝업 안내 문구');
    await clickSel('[data-action="auth-google"]');
    await sleep(600);
    ok(w.TL.Auth.signedIn(), 'Google 로그인 성공(가짜 인증)');
    ok(!!q('.acct-chip') && text('.acct-chip').indexOf('테스트 재원') >= 0, '로그인 뒤 헤더 계정 칩', text('.acct-chip'));
    ok(S.signedIn() && S.settings().nickname === '테스트 재원', '로그인: 내 이름 기본값', S.settings().nickname);
    ok(!q('.login-note'), '로그인 뒤 로그인 안내 카드 사라짐');

    /* ---------------------------------------------------- 1) 새 여행 + 달력 */
    await clickSel('[data-action="new-trip"]');
    await sleep(320);
    noOverflow('새 여행 시트');
    ok(qa('input[type="date"]').length === 0, '네이티브 date 입력 없음');
    ok(!!q('.range-btn') && !!q('#cal-wrap'), '기간 버튼·달력 컨테이너');
    ok(q('#cal-wrap').className.indexOf('hide') >= 0, '달력은 처음엔 접힘');
    var sh = rect('.sheet');
    ok(sh && sh.width <= 390 + 1, '시트 폭이 화면 안', sh && Math.round(sh.width));
    ok(sh && Math.abs(sh.bottom - 844) <= 2, '시트가 화면 아래에 붙음', sh && Math.round(sh.bottom));

    await clickSel('[data-action="cal-toggle"]');
    await sleep(120);
    ok(!!q('.cal-grid'), '한 번 눌러 달력 펼침');
    var cr = rect('.cal');
    ok(cr && cr.height > 240 && cr.width <= 358, '달력 크기 정상', cr && Math.round(cr.width) + 'x' + Math.round(cr.height));
    ok(qa('.cal-day').length === 42, '42칸 달력', qa('.cal-day').length);
    noOverflow('달력 펼친 시트');

    await pickDate('2026-12-05');
    ok(text('#range-label').indexOf('12.5') >= 0, '시작일 12.5 선택', text('#range-label'));
    ok(text('#range-sub').indexOf('종료일') >= 0, '종료일 안내');
    await pickDate('2026-12-08');
    ok(text('#range-label').indexOf('12.8') >= 0 && text('#range-sub').indexOf('3박 4일') >= 0, '기간 12.5~12.8 · 3박 4일', text('#range-label') + ' / ' + text('#range-sub'));
    ok(q('#cal-wrap').className.indexOf('hide') >= 0, '기간을 다 고르면 달력 접힘');
    ok(q('#f_start').value === '2026-12-05' && q('#f_end').value === '2026-12-08', '숨은 값 동기화');

    setv('#f_name', '모바일 테스트 여행');
    setv('#f_dest', '부산');
    setv('#member-new', '아내');
    await clickSel('[data-action="add-member-chip"]');
    setv('#member-new', '아들');
    await clickSel('[data-action="add-member-chip"]');
    setv('#member-new', '동생');
    await clickSel('[data-action="add-member-chip"]');
    ok(memberCount() === 4, '일행 칩 4개', memberCount());
    ok(qa('#member-list .chip-x').length === 4, '칩마다 삭제 버튼');
    var before = memberCount();
    await click(qa('#member-list .chip-x')[3]);
    ok(memberCount() === before - 1, '칩 삭제로 1명 빠짐', memberCount());
    setv('#member-new', '아내');
    await clickSel('[data-action="add-member-chip"]');
    ok(memberCount() === before - 1, '중복 이름은 추가 안 됨', memberCount());

    await clickSel('[data-action="save-new-trip"]');
    ok(/\/t\//.test(w.location.hash), '여행 화면으로 이동', w.location.hash);
    var trip = S.trips().filter(function (t) { return t.name === '모바일 테스트 여행'; })[0];
    ok(!!trip, '여행 저장됨');
    ok(trip && trip.startDate === '2026-12-05' && trip.endDate === '2026-12-08', '저장된 기간', trip && trip.startDate + '~' + trip.endDate);
    ok(trip && trip.members.length === 3, '저장된 일행 3명', trip && trip.members.length);
    ok(qa('.chips .chip').length === 5, 'Day 탭 5개(사전준비+4)', qa('.chips .chip').length);
    ok(!!q('.people-bar') && !!q('[data-action="manage-members"]'), '상단 일행 줄·관리 버튼');
    noOverflow('일정 탭');

    /* ------------------------------------------------------- 2) 일행 관리 */
    await clickSel('[data-action="manage-members"]');
    ok(!!q('.mem-rows') && qa('.mrow').length === 3, '일행 관리 목록 3명', qa('.mrow').length);
    setv('#mem-new', '친구');
    await clickSel('[data-action="mem-add"]');
    ok(qa('.mrow').length === 4, '일행 추가', qa('.mrow').length);
    await click(qa('[data-action="mem-edit"]')[3]);
    ok(!!q('#mem-edit-input'), '이름 수정 입력 열림');
    setv('#mem-edit-input', '친구2');
    await click(qa('[data-action="mem-save"]')[0]);
    ok(S.trips().filter(function (t) { return t.id === trip.id; })[0].members.some(function (m) { return m.name === '친구2'; }), '이름 수정 저장');
    await click(qa('[data-action="mem-set-me"]')[3]);
    ok(S.meId(S.trip(trip.id), null) === S.trip(trip.id).members[3].id, '내 이름 지정');
    await click(qa('[data-action="mem-del"]')[3]);
    ok(qa('.mrow').length === 3, '일행 삭제', qa('.mrow').length);
    await clickSel('[data-action="close-modal"]');
    ok(!q('.modal'), '시트 닫힘');

    /* ------------------------------------------------- 3) 일정 추가·이동·수정 */
    await click(q('.chip[data-day="d2"]'));
    await click(q('.fab'));
    ok(!!q('#f_title'), '일정 시트 열림');
    setv('#f_time', '930');
    setv('#f_title', '감천문화마을');
    setv('#f_place', '감천문화마을');
    await clickSel('[data-action="save-schedule"]');
    ok(qa('.tl-item').length === 1, '일정 1개 추가', qa('.tl-item').length);
    ok(text('.tl-time').indexOf('09:30') >= 0, '시간 09:30 정규화', text('.tl-time'));
    ok(!!q('a.tl-map.kakao') && !!q('a.tl-map.google'), '카카오맵·구글맵 링크');

    await click(q('.fab'));
    setv('#f_title', '국밥');
    setv('#f_time', '1200');
    await clickSel('[data-action="save-schedule"]');
    ok(qa('.tl-item').length === 2, '일정 2개', qa('.tl-item').length);
    await click(q('[data-action="move-schedule"][data-dir="-1"]:not([disabled])'));
    var titles = qa('.tl-title').map(function (e) { return e.textContent.trim(); });
    ok(titles[0] === '국밥' && titles[1] === '감천문화마을', '위로 이동', titles.join(' > '));
    await click(qa('[data-action="edit-schedule"]')[1]);
    setv('#f_title', '감천문화마을 (수정)');
    await clickSel('[data-action="save-schedule"]');
    ok(text('.tl-item:nth-child(2) .tl-title').indexOf('수정') >= 0, '일정 수정', text('.tl-item:nth-child(2) .tl-title'));
    await click(qa('[data-action="del-schedule"]')[1]);
    ok(qa('.tl-item').length === 1, '일정 삭제', qa('.tl-item').length);
    noOverflow('일정 목록');

    /* ------------------------------------------- 4) 가계부 (외화·정산·CSV) */
    await clickSel('[data-tab="money"]');
    await click(q('.fab'));
    setv('#f_amount', '39000');
    setv('#f_currency', 'JPY');
    await sleep(200);
    ok(q('#f_rate').value && Number(q('#f_rate').value) > 0, '통화 바꾸면 환율 자동', q('#f_rate').value);
    setv('#f_rate', '9.4');   // 자동 조회가 흔들리지 않게 고정 (이후 계산 결정적)
    ok(text('#f_preview').indexOf('366,600') >= 0, '환산 미리보기', text('#f_preview'));
    setv('#f_title', '라멘');
    await clickSel('[data-action="save-expense"]');
    ok(text('.sum-card .big').indexOf('366,600') >= 0, '총 지출 원화 환산', text('.sum-card .big'));
    ok(text('.settle-row').length >= 0 && qa('.settle-row').length === 3, '정산 3명', qa('.settle-row').length);
    ok(qa('.transfer').length === 2, '정산 이체 2건', qa('.transfer').length);

    await click(q('.fab'));
    setv('#f_amount', '20000');

    async function swReg(win) {

        ]);
      } catch (e) { return null; }

    async function swRegs(win) {

      if (reg) break;
      await sleep(250);
    }
    if (!reg) {
      var regsNow = await swRegs(window);
      if (!regsNow.length) regsNow = await swRegs(w);
      reg = regsNow[0] || null;
    }
    ok(!!reg, '서비스 워커 등록', reg && reg.scope);

    var coreSrc = q('script[src*="core.js"]') ? q('script[src*="core.js"]').getAttribute('src') : '';

    var swDiag = '';

      try { shellHit = !!(await caches.match(cacheKey)); } catch (e) { swDiag = 'match:' + e; }
      if (shellHit) break;
      try {
        var reg2 = await swReg(window);
        swDiag = 'sw:' + (reg2 ? (reg2.active ? 'active' : reg2.installing ? 'installing' : reg2.waiting ? 'waiting' : '?') : 'none') +
          ' caches:' + (await caches.keys()).join(',');

      await sleep(250);

      try {

    w.eval('__qaDb.docs["trips/SHELL23"] = { updatedAt: "2026-11-24T01:00:00.000Z" };');

    ok(rejoin3 === 'rejected:notfound', 'v23 고아 껍데기 방도 거절', rejoin3);
    w.eval([
      '__qaDb.docs["trips/OTH999"] = { name: "남의 방", createdAt: "2026-11-20T00:00:00.000Z", members: [{ id: "z", name: "남", uid: "other1" }] };',
      'TL.Store.state().trips.push({ id: "remote_OTH999", name: "남의 방", startDate: "2026-12-01", endDate: "2026-12-02",',
      '  members: [{ id: "z", name: "남", uid: "other1" }], rates: {}, remoteCode: "OTH999", data: { schedules: [], expenses: [], checklist: [], reservations: [] } });',
      'TL.Store.notify();'
    ].join('\n'));
    var otherDel = await w.eval('TL.Store.destroyTrip("remote_OTH999").then(function () { return "ok"; }, function (e) { return "err:" + (e && e.code); })');
    ok(otherDel === 'err:notowner', 'v23 남의 예전 방은 폭파 불가', otherDel);
    ok(w.eval('!!__qaDb.docs["trips/OTH999"]'), 'v23 남의 방 문서는 그대로');
    w.eval('TL.Store.disconnect(); TL.Store.testInjectRemote(null, null); TL.Store.removeTrip("remote_OTH999"); TL.Store.clearAll();');
    ok(true, 'v23 모의 Firestore 정리(실제 triplog-c4921 쓰기 없음)');

    /* --------------------------------------------- 8) 초대 링크 진입 흐름 (v21: 없는·폭파된 링크는 홈으로) */
    var inv = document.getElementById('invite');
    inv.src = '../index.html?qa=invite&t=' + Date.now() + '&trip=7KD2QM';
    var idoc = null, loginShown = false;
    for (var iv = 0; iv < 100; iv++) {
      await sleep(150);
      idoc = inv.contentDocument;
      if (idoc && idoc.querySelector('[data-action="auth-google"]')) { loginShown = true; break; }
    }
    ok(loginShown, '초대 링크(게스트): 로그인 안내 시트');
    var iw = inv.contentWindow;
    ok(!!iw && !!iw.TL && iw.TL.Store.isDefaultFirebase(), '초대 링크도 기본 설정으로 열림');
    ok(!!iw && !iw.TL.Store.signedIn() && !iw.TL.Store.trips().some(function (t) { return t.remoteCode === '7KD2QM'; }), '초대 링크: 로그인 전에는 참여하지 않음');
    // 로그인하면 대기 중인 코드로 참여를 이어간다 — 서버가 '없는 방'이라고 답하면 입장시키지 않고 홈으로 돌려보낸다
    iw.eval('globalThis.__ivIO = { writeDoc: function () { return Promise.resolve(true); }, deleteDoc: function () { return Promise.resolve(true); }, subscribeColl: function () { return function () {}; } }; TL.Account.testSetIO(__ivIO);');
    iw.eval('TL.Store.connect = function () { var e = new Error(TL.Store.GONE_MESSAGE); e.code = "notfound"; return Promise.reject(e); };');
    iw.eval('TL.Auth.testSignIn({ uid: "qa9", displayName: "초대 손님", email: "invite@example.com" })');
    var goneShown = false;
    for (var iv2 = 0; iv2 < 100; iv2++) {
      await sleep(150);
      idoc = inv.contentDocument;
      if (idoc && idoc.body.textContent.indexOf('삭제되었거나 유효하지 않은 초대 링크예요') >= 0) { goneShown = true; break; }
    }
    ok(goneShown, '없는·폭파된 초대 링크: 유효하지 않다는 안내');
    ok(idoc && !idoc.querySelector('#f_code'), '참여 시트를 열지 않음');
    ok(idoc && !idoc.querySelector('.modal'), '안내 뒤 화면이 정리됨');
    ok(iw.TL.App.view.screen === 'home', '홈으로 튕겨냄', iw.TL.App.view.screen);
    ok(!iw.TL.Store.trips().some(function (t) { return t.remoteCode === '7KD2QM'; }), '여행 자리를 만들지 않음');

    /* ------------------------------------------------------- 9) 로드·오류 */
    var res = w.performance.getEntriesByType('resource').filter(function (r) { return /\.(js|css)(\?|$)/.test(r.name); });
    var bad = res.filter(function (r) { return r.responseStatus && r.responseStatus !== 200; });
    ok(res.length >= 9, 'JS/CSS 리소스 로드 수', res.length);
    ok(bad.length === 0, 'JS/CSS 200 OK', bad.map(function (b) { return b.responseStatus + ' ' + b.name; }).join(', '));
    ok(errs.length === 0, '콘솔 오류 0건', errs.slice(0, 5).join(' | '));

    finish();
  }

  function finish() {
    var summary = pass + ' passed, ' + fails.length + ' failed';
    lines.push('---- ' + summary + ' ----');
    out.textContent = lines.join('\n');
    window.__QA = { pass: pass, fails: fails, lines: lines, done: true, summary: summary };
    document.title = 'QA ' + summary;
  }

  run().catch(function (e) {
    fails.push('예외: ' + (e && e.stack || e));
    log('HEAD', '예외: ' + (e && e.message));
    finish();
  });
})();
</script>
