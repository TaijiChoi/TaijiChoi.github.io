<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>트립로그 v22 화면 캡처 — 실시간 환율·IDR / 지도 핀</title>
<style>
  body{margin:0;padding:16px;background:#0F172A;font-family:sans-serif;color:#fff}
  iframe{width:390px;height:844px;border:0;border-radius:16px;background:#fff;display:block}
</style>
</head>
<body>
<iframe id="f" title="트립로그 v22 캡처" src="../index.html?shot=22"></iframe>
<script>
(function () {
  'use strict';
  var f = document.getElementById('f');
  function ready() {
    try { var w = f.contentWindow; return !!(w && w.TL && w.TL.Store && w.TL.App && w.document.getElementById('screen')); } catch (e) { return false; }
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function waitReady() {
    for (var i = 0; i < 160; i++) { if (ready()) return true; await sleep(80); }
    return false;
  }
  function w() { return f.contentWindow; }
  function seed() {
    var win = w();
    /* 캡처용: 실제 Firestore에 방을 만들지 않도록 연결을 가짜로 바꾼다 */
    win.eval('TL.Store.connect = function (tripId) { var t = TL.Store.trip(tripId); if (t && !t.remoteCode) { t.remoteCode = "SHOT22"; t.inviteCode = "SHOT22"; } return Promise.resolve({ code: "SHOT22" }); };');
    win.eval('TL.Store.testSetRateFetcher(function () { return Promise.resolve({ IDR: 0.0875, USD: 1390, JPY: 9.6 }); });');
    win.TL.Auth.testSignIn({ uid: 'shot22', displayName: '재원', email: 'shot22@example.com' });
    win.TL.Store.clearAll();
    var t = win.TL.Store.createTrip({
      name: '발리 4박 5일', destination: '발리', startDate: '2026-12-05', endDate: '2026-12-09',
      members: [{ id: 'm1', name: '재원', uid: 'shot22' }, { id: 'm2', name: '아내' }, { id: 'm3', name: '아들' }],
      baseCurrency: 'IDR', rates: { IDR: 0.0875, USD: 1390 }
    });
    var ids = ['m1', 'm2', 'm3'];
    function exp(day, amount, cur, rate, cat, title) {
      win.TL.Store.add(t.id, 'expenses', {
        dayKey: day, amount: amount, currency: cur, rate: rate, category: cat, title: title,
        payerId: 'm1', sharedWith: ids
      });
    }
    exp('d1', 1250000, 'IDR', 0.0875, 'food', '우붓 저녁');
    exp('d2', 850000, 'IDR', 0.0875, 'etc', '스파 마사지');
    exp('d2', 350000, 'IDR', 0.0875, 'transport', '공항 택시');
    exp('d3', 24.5, 'USD', 1390, 'food', '비치 클럽');
    exp('d1', 320000, 'KRW', 1, 'stay', '숙소 잔금');
    win.TL.Store.add(t.id, 'schedules', { dayKey: 'd1', time: '10:00', title: '우붓 시장', category: 'sight', place: '우붓 시장', lat: -8.5069, lng: 115.2625, source: 'map' });
    win.TL.Store.add(t.id, 'schedules', { dayKey: 'd1', time: '13:00', title: '짬뿌한 폭포', category: 'sight', place: '짬뿌한', lat: -8.5912, lng: 115.2855, source: 'map' });
    // 캡처에는 실제 연결처럼 '일행과 실시간 공유 중'으로 보이게 한다 (서버는 건드리지 않음)
    win.TL.Store.testInjectConn(t.id, 'SHOT22', true);
    win.TL.Store.notify();
    window.__tripId = t.id;
    return t.id;
  }
  async function ensureSignIn() {
    var win = w();
    await sleep(700);
    if (!win.TL.Auth.signedIn()) {
      win.TL.Auth.testSignIn({ uid: 'shot22', displayName: '재원', email: 'shot22@example.com' });
      await sleep(200);
    }
    return win;
  }
  window.__shotMoney = async function () {
    var win = await ensureSignIn();
    win.TL.App.openTrip(window.__tripId, 'money');
    await sleep(350);
    win.TL.Actions['refresh-rates']();
    await sleep(3800);
    win.TL.App.render();
    await sleep(400);
    win.scrollTo(0, 0);
    return true;
  };
  window.__scrollTo = async function (y) { w().scrollTo(0, y); await sleep(250); return true; };
  window.__shotPin = async function () {
    var win = await ensureSignIn(), doc = win.document;
    win.TL.App.openTrip(window.__tripId, 'schedule');
    await sleep(400);
    win.TL.Dialogs.schedule(win.TL.Store.trip(window.__tripId), null, 'd1');
    await sleep(250);
    doc.getElementById('f_coord').value = 'https://www.google.com/maps/place/Ubud/@-8.5,115.2,17z/data=!3d-8.5069!4d115.2625';
    win.TL.Actions['use-coord']();
    await sleep(250);
    win.TL.Actions['pin-toggle'](doc.querySelector('[data-action="pin-toggle"]'));
    for (var i = 0; i < 70; i++) {
      if (doc.querySelector('#pin-map.leaflet-container')) break;
      await sleep(150);
    }
    win.TL.Dialogs.testPickAt(-8.5069, 115.2625);
    await sleep(200);
    if (win.TL.RouteMap && win.TL.RouteMap.recenterPick) win.TL.RouteMap.recenterPick(-8.5069, 115.2625);
    doc.getElementById('f_title').value = '우붓 시장';
    var body = doc.querySelector('.sheet-body') || doc.querySelector('.sheet');
    if (body) body.scrollTop = 190;
    await sleep(2500);
    return true;
  };
  (async function () {
    if (!(await waitReady())) { document.title = 'shot-error boot'; return; }
    await sleep(200);
    seed();
    await sleep(250);
    window.__ready = true;
    document.title = 'shot-ready';
  })();
})();
</script>
</body>
</html>
