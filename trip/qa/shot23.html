<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>트립로그 v23 화면 캡처 — 도로 경로·카테고리 핀 색</title>
<style>
  body{margin:0;padding:16px;background:#0F172A;font-family:sans-serif;color:#fff}
  iframe{width:390px;height:844px;border:0;border-radius:16px;background:#fff;display:block}
</style>
</head>
<body>
<iframe id="f" title="트립로그 v23 캡처" src="../index.html?shot=23"></iframe>
<script>
(function () {
  'use strict';
  var f = document.getElementById('f');
  function ready() {
    try { var w = f.contentWindow; return !!(w && w.TL && w.TL.Store && w.TL.App && w.document.getElementById('screen')); } catch (e) { return false; }
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function waitReady() {
    for (var i = 0; i < 160; i++) { if (ready()) return true; await sleep(80); }
    return false;
  }
  function w() { return f.contentWindow; }
  function seed() {
    var win = w();
    /* 캡처용: 실제 Firestore에 방을 만들지 않도록 연결을 가짜로 바꾼다 */
    win.eval('TL.Store.connect = function (tripId) { var t = TL.Store.trip(tripId); if (t && !t.remoteCode) { t.remoteCode = "SHOT23"; t.inviteCode = "SHOT23"; } return Promise.resolve({ code: "SHOT23" }); };');
    win.TL.Auth.testSignIn({ uid: 'shot23', displayName: '재원', email: 'shot23@example.com' });
    win.TL.Store.clearAll();
    var t = win.TL.Store.createTrip({
      name: '서울 하루 코스', destination: '서울', startDate: '2026-12-05', endDate: '2026-12-06',
      members: [{ id: 'm1', name: '재원', uid: 'shot23' }, { id: 'm2', name: '아내' }, { id: 'm3', name: '아들' }]
    });
    function sched(day, time, title, cat, place, lat, lng, order) {
      win.TL.Store.add(t.id, 'schedules', {
        dayKey: day, time: time, title: title, category: cat, place: place, placeName: place,
        lat: lat, lng: lng, source: 'map', order: order
      });
    }
    sched('d1', '09:30', '경복궁', 'sight', '경복궁', 37.5796, 126.9770, 0);
    sched('d1', '12:00', '광장시장 육회', 'food', '광장시장', 37.5701, 126.9996, 1);
    sched('d1', '14:30', '익선동 한옥카페', 'cafe', '익선동', 37.5744, 126.9898, 2);
    sched('d1', '16:30', '명동 쇼핑', 'shop', '명동', 37.5636, 126.9850, 3);
    sched('d1', '18:30', '남산서울타워', 'sight', '남산서울타워', 37.5512, 126.9882, 4);
    win.TL.Store.testInjectConn(t.id, 'SHOT23', true);
    win.TL.Store.notify();
    window.__tripId = t.id;
    return t.id;
  }
  function emojiFont() {
    var win = w(), doc = win.document;
    if (doc.getElementById('shot-emoji-font')) return;
    var st = doc.createElement('style');
    st.id = 'shot-emoji-font';
    st.textContent = "@import url('https://fonts.googleapis.com/css2?family=Noto+Color+Emoji');" +
      "body,button,input,textarea{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',Roboto,'Noto Color Emoji',sans-serif !important}";
    doc.head.appendChild(st);
  }
  async function ensureSignIn() {
    var win = w();
    emojiFont();
    await sleep(700);
    if (!win.TL.Auth.signedIn()) {
      win.TL.Auth.testSignIn({ uid: 'shot23', displayName: '재원', email: 'shot23@example.com' });
      await sleep(200);
    }
    return win;
  }
  window.__shotRoute = async function () {
    var win = await ensureSignIn(), doc = win.document;
    win.TL.App.openTrip(window.__tripId, 'schedule');
    for (var i = 0; i < 120; i++) {
      if (doc.querySelector('.rt-badge.road') && doc.querySelector('#route-map.leaflet-container')) break;
      await sleep(200);
    }
    // 실제 OSRM이 막힌 환경이면 같은 모양의 모의 응답으로 다시 그린다(캡처가 폴백으로 찍히지 않게)
    if (!doc.querySelector('.rt-badge.road')) {
      win.eval([
        'TL.Route.testSetFetcher(function () { return Promise.resolve({ ok: true, status: 200, json: function () {',
        '  return { code: "Ok", routes: [{ distance: 6420, duration: 1500, legs: [{ distance: 2280, duration: 540 }, { distance: 1450, duration: 330 }, { distance: 1690, duration: 390 }, { distance: 1000, duration: 240 }],',
        '    geometry: { coordinates: [[126.977,37.5796],[126.983,37.576],[126.985,37.572],[126.9898,37.5744],[126.985,37.5636],[126.9882,37.5512]] } }] };',
        '} }); });'
      ].join('\n'));
      win.TL.Route.clear();
      win.TL.App.render();
      for (var j = 0; j < 60; j++) {
        if (doc.querySelector('.rt-badge.road') && doc.querySelector('#route-map.leaflet-container')) break;
        await sleep(200);
      }
    }
    await sleep(2500);   // 지도 타일이 다 그려질 때까지
    win.scrollTo(0, 0);
    return true;
  };
  window.__state = function () {
    var win = w(), doc = win.document;
    return {
      badge: (doc.querySelector('.rt-badge') || {}).textContent || '',
      head: (doc.querySelector('.route-head .rb-tx small') || {}).textContent || '',
      pins: Array.prototype.map.call(doc.querySelectorAll('#route-map .rt-icon .rt-pin'), function (p) {
        return p.textContent + ':' + (p.getAttribute('style') || '');
      }),
      legend: Array.prototype.map.call(doc.querySelectorAll('.cat-legend .cl-item'), function (c) { return c.textContent; }),
      segs: Array.prototype.map.call(doc.querySelectorAll('.seg-row'), function (s) { return s.textContent.replace(/\s+/g, ' ').trim(); })
    };
  };
  (async function () {
    if (!(await waitReady())) { document.title = 'shot-error boot'; return; }
    await sleep(200);
    seed();
    await sleep(300);
    window.__ready = true;
    document.title = 'shot-ready';
  })();
})();
</script>
</body>
</html>
