<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>트립로그 v26 화면 캡처 — 일정 시트 순서(장소 → 일정 이름)</title>
<style>
  body{margin:0;padding:16px;background:#0F172A;font-family:sans-serif;color:#fff}
  iframe{width:390px;height:844px;border:0;border-radius:16px;background:#fff;display:block}
</style>
</head>
<body>
<iframe id="f" title="트립로그 v26 캡처" src="../qa/shot26/app.html?shot=26"></iframe>
<script>
(function () {
  'use strict';
  var f = document.getElementById('f');
  function ready() {
    try { var w = f.contentWindow; return !!(w && w.TL && w.TL.Store && w.TL.App && w.document.getElementById('screen')); } catch (e) { return false; }
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function waitReady() {
    for (var i = 0; i < 160; i++) { if (ready()) return true; await sleep(80); }
    return false;
  }
  function w() { return f.contentWindow; }
  function seed() {
    var win = w();
    win.eval('TL.Store.connect = function (tripId) { var t = TL.Store.trip(tripId); if (t && !t.remoteCode) { t.remoteCode = "SHOT26"; t.inviteCode = "SHOT26"; } return Promise.resolve({ code: "SHOT26" }); };');
    win.TL.Auth.testSignIn({ uid: 'shot26', displayName: '재원', email: 'shot26@example.com' });
    win.TL.Store.clearAll();
    var t = win.TL.Store.createTrip({
      name: '부산 1박 2일', destination: '부산', startDate: '2026-12-05', endDate: '2026-12-06',
      members: [{ id: 'm1', name: '재원', uid: 'shot26' }, { id: 'm2', name: '아내' }, { id: 'm3', name: '아들' }]
    });
    function sched(day, time, title, cat, place, order) {
      win.TL.Store.add(t.id, 'schedules', { dayKey: day, time: time, title: title, category: cat, place: place, placeName: place, order: order });
    }
    sched('d1', '09:30', '광안리 해변', 'sight', '광안리 해변', 0);
    win.TL.Store.testInjectConn(t.id, 'SHOT26', true);
    win.TL.Store.notify();
    window.__tripId = t.id;
    return t.id;
  }
  function emojiFont() {
    var win = w(), doc = win.document;
    if (doc.getElementById('shot-emoji-font')) return;
    var st = doc.createElement('style');
    st.id = 'shot-emoji-font';
    st.textContent = "@import url('https://fonts.googleapis.com/css2?family=Noto+Color+Emoji');" +
      "body,button,input,textarea{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',Roboto,'Noto Color Emoji',sans-serif !important}";
    doc.head.appendChild(st);
  }
  window.__shotSheet = async function () {
    var win = w(), doc = win.document;
    emojiFont();
    await sleep(600);
    if (!win.TL.Auth.signedIn()) win.TL.Auth.testSignIn({ uid: 'shot26', displayName: '재원', email: 'shot26@example.com' });
    win.TL.App.openTrip(window.__tripId, 'schedule');
    await sleep(500);
    win.TL.Dialogs.schedule(win.TL.Store.trip(window.__tripId), null, 'd1');
    await sleep(450);
    /* 장소를 치면 일정 이름이 자동으로 채워지는 모습 (실제 입력 이벤트 경로) */
    var q = doc.getElementById('pl_q');
    if (q) {
      q.value = '흰여울문화마을';
      q.dispatchEvent(new Event('input', { bubbles: true }));
      q.dispatchEvent(new Event('change', { bubbles: true }));
    }
    await sleep(450);
    return true;
  };
  window.__state = function () {
    var doc = w().document;
    var kids = Array.prototype.slice.call(doc.querySelectorAll('.sheet-body > *'));
    return {
      order: kids.map(function (el) {
        var lab = el.querySelector('.fl');
        if (lab) return lab.textContent.trim().split(' ')[0];
        if (el.classList.contains('place-box')) return '장소 검색';
        if (el.classList.contains('coord-box')) return '지도에서 위치';
        return (el.className || el.tagName);
      }),
      place: (doc.getElementById('pl_q') || {}).value || '',
      title: (doc.getElementById('f_title') || {}).value || '',
      titleHint: (doc.getElementById('title-hint') || {}).textContent || '',
      time: (doc.getElementById('tp-val') || {}).textContent || ''
    };
  };
  (async function () {
    if (!(await waitReady())) { document.title = 'shot-error boot'; return; }
    try {
      var win = w();
      var regs = await win.navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function (r) { return r.unregister(); }));
      var keys = await win.caches.keys();
      await Promise.all(keys.filter(function (k) { return k.indexOf('triplog') === 0; }).map(function (k) { return win.caches.delete(k); }));
    } catch (e) { /* 없으면 그냥 진행 */ }
    f.src = '../qa/shot26/app.html?shot=26&cb=' + Date.now();
    await sleep(400);
    if (!(await waitReady())) { document.title = 'shot-error boot2'; return; }
    await sleep(400);
    seed();
    await sleep(300);
    window.__ready = true;
    document.title = 'shot-ready';
  })();
})();
</script>
</body>
</html>
