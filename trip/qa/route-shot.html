<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>트립로그 v17 — 동선 지도 캡처</title>
<style>
  html,body{margin:0;background:#E8EDF5;font-family:-apple-system,"Malgun Gothic",sans-serif}
  #f{display:block;width:390px;height:844px;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="f" title="하루 동선 지도 (구글지도/OSM)" src="../index.html"></iframe>
<script>
/* v17 QA: 동선 지도 카드가 화면 위쪽에 오도록 스크롤해 두고, 타일이 다 뜨면 window.__READY = true */
(function () {
  'use strict';
  var f = document.getElementById('f');
  var qs = new URLSearchParams(location.search);
  var src = qs.get('src') === 'osm' ? 'osm' : 'google';
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function app() {
    var w = f.contentWindow;
    return (w && w.TL && w.TL.App && w.TL.Store && w.document.getElementById('screen')) ? w : null;
  }
  async function main() {
    for (var i = 0; i < 120 && !app(); i++) await sleep(80);
    var w = app();
    if (!w) throw new Error('앱이 뜨지 않았어요');
    var S = w.TL.Store, A = w.TL.App;
    w.localStorage.clear();
    var t = S.createTrip({
      name: '오사카 3박 4일', destination: '오사카 · 교토',
      startDate: '2026-12-05', endDate: '2026-12-08',
      members: [{ id: 'm1', name: '재원' }, { id: 'm2', name: '아내' }, { id: 'm3', name: '아들' }]
    });
    [['10:00', '오사카성', 'sight', '오사카성', 34.6873, 135.5259, '大阪城公園'],
     ['12:30', '구로몬 시장', 'food', '구로몬 시장', 34.6650, 135.5060, '黒門市場'],
     ['15:00', '신사이바시', 'shop', '신사이바시', 34.6738, 135.5012, '心斎橋'],
     ['19:00', '우메다 공중정원', 'sight', '우메다 스카이빌딩', 34.7055, 135.4903, '梅田スカイビル']
    ].forEach(function (a) {
      S.add(t.id, 'schedules', { dayKey: 'd2', time: a[0], title: a[1], category: a[2], place: a[3], lat: a[4], lng: a[5], source: 'kakao', address: a[6] });
    });
    A.view.mapSource = src;
    A.openTrip(t.id, 'schedule');
    A.view.day = 'd2';
    A.view.mapOpen = true;
    A.render();

    // 타일이 다 뜰 때까지 (최대 15초)
    var tiles = 0;
    for (var k = 0; k < 75; k++) {
      var ims = Array.prototype.slice.call(w.document.querySelectorAll('#route-map img.leaflet-tile'));
      tiles = ims.filter(function (im) { return im.naturalWidth > 0; }).length;
      if (tiles >= 4) break;
      await sleep(200);
    }
    await sleep(300);
    var card = w.document.querySelector('.route-card');
    if (card) {
      var y = card.getBoundingClientRect().top + w.scrollY - 8;
      w.scrollTo(0, y);
    }
    await sleep(400);
    window.__TILES = tiles;
    window.__READY = true;
  }
  main().catch(function (e) { window.__ERR = String(e && e.stack || e); });
})();
</script>
</body>
</html>
